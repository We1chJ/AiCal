<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AiCal</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>
<body>

  <!-- Input Screen -->
  <div id="input-screen" class="screen">
    <div class="header">
      <img src="../../assets/logo.png" class="logo" alt="AiCal" />
      <h1>AiCal</h1>
      <p class="subtitle">Describe an event and AI will schedule it</p>
    </div>

    <div class="body">
      <textarea id="event-text" placeholder="e.g. Team standup every Monday at 9am in the conference room, 30 minutes"></textarea>
      <button id="parse-btn" class="btn-primary">Parse Event</button>
      <div id="parse-error" class="error"></div>

      <details class="api-key-section">
        <summary>OpenAI API Key</summary>
        <div class="api-key-row">
          <input type="password" id="api-key" placeholder="sk-..." />
          <button id="save-key-btn" class="btn-secondary">Save</button>
        </div>
        <div id="key-status" class="key-status"></div>
      </details>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen" class="screen" style="display:none">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p>Parsing event details...</p>
    </div>
  </div>

  <!-- Review Screen -->
  <div id="review-screen" class="screen" style="display:none">
    <div class="header">
      <h1>Review Event</h1>
      <p class="subtitle">Edit if needed, then confirm</p>
    </div>

    <div class="body">
      <div class="field">
        <label>Title</label>
        <input type="text" id="r-title" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date</label>
          <input type="date" id="r-date" />
        </div>
        <div class="field">
          <label>Recurrence</label>
          <select id="r-recurrence">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Start Time</label>
          <input type="time" id="r-start" />
        </div>
        <div class="field">
          <label>End Time</label>
          <input type="time" id="r-end" />
        </div>
      </div>
      <div class="field">
        <label>Location / Link</label>
        <input type="text" id="r-location" placeholder="Room, address, or meeting link" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="r-notes" rows="3"></textarea>
      </div>

      <div id="review-error" class="error"></div>

      <div class="action-row">
        <button id="back-btn" class="btn-secondary">Back</button>
        <button id="confirm-btn" class="btn-primary">Add to Calendar</button>
      </div>
    </div>
  </div>

</body>
</html>
